# schema.rs is generated from the migrations (`diesel print-schema`) and
# committed; CI regenerates it and fails on a difference. The FTS5 table
# and its shadow tables are not in the DSL — search speaks SQL in one place.
[print_schema]
file = "src/schema.rs"
filter = { except_tables = ["^search$", "^search_"] }
# fts_docs.doc is the index's rowid: an i64 like every number here.
sqlite_integer_primary_key_is_bigint = true

[migrations_directory]
dir = "migrations"
