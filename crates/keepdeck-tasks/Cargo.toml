[package]
name = "keepdeck-tasks"
version = "0.1.0"
edition = "2021"
description = "The task board's store: one SQLite database for every board, the sole truth of the tracker."

[dependencies]
diesel = { version = "2.3", default-features = false, features = ["sqlite", "with-deprecated", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
# The same SQLite the rest of the app links (rusqlite's), compiled in.
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
ts-rs = "10"

[dev-dependencies]
tempfile = "3"
