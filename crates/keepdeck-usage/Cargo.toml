[package]
name = "keepdeck-usage"
version = "0.1.0"
edition = "2021"
description = "The durable usage ledger: deltas from cumulative pane reports, stored and compacted in SQLite."

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
